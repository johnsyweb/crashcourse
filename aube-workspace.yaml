paranoid: true
packageManagerStrictVersion: true
# 7 days — aligned with Renovate minimumReleaseAge in johnsyweb/renovate-config
minimumReleaseAge: 10080
# chromium-bidi ≤17.x used GitHub Actions OIDC trusted publishing; Chrome-for-Testing
# releases (15x.x) publish as chrome-devtools-npm without that provenance evidence.
trustPolicyExclude:
  - chromium-bidi
allowBuilds:
  puppeteer: false
  unrs-resolver: true
  esbuild: true
overrides:
  js-yaml: '>=4.2.0'
  uuid: '>=11.1.1'
  http-proxy-middleware: '>=3.0.6'
# Pin darwin and linux (not `current`) so a Linux lockfile refresh in CI still
# records macOS optional native binaries.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
